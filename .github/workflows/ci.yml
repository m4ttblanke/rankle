name: CI

# Validates every PR and every push to main as five independent, parallel
# jobs — Lint & Typecheck, Build & Secret Scan, Vitest, SQL & RLS, and
# Playwright — each a required status check on main. Deployment stays
# entirely with Vercel's existing Git integration (Preview on PRs,
# Production on merge to main) — this workflow never deploys anything and
# never touches Vercel or production Supabase. See docs/OPS.md sec 32 for
# the full design rationale, including why Vitest, SQL & RLS, and
# Playwright each boot their own independent local Supabase stack rather
# than sharing one across jobs.

on:
  pull_request:
  push:
    branches: [main]

# One concurrency group per workflow+ref: a new push to the same PR or the
# same branch cancels that ref's still-running workflow (all of its jobs,
# not just one), while different PRs/branches each get their own ref and
# never cancel each other. `push: branches: [main]` all share the ref
# `refs/heads/main`, so back-to-back direct pushes to main also cancel the
# older run — acceptable since main is protected and direct pushes are the
# admin-bypass exception, not the normal path.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Cheapest, most self-contained check first — scans git-tracked
      # files directly, no dependencies installed yet.
      - name: Secret scan
        run: bash scripts/secret-scan.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      # No live backend is required for `next build` here: every route in
      # this app is server-rendered on demand (no generateStaticParams / no
      # build-time data fetching), so lib/env.ts only needs a
      # syntactically-valid URL/key to pass its Zod schema. This job never
      # starts Supabase at all — these values are placeholders, never
      # reachable, and distinct from the real local-stack values the
      # Vitest/SQL/Playwright jobs generate for themselves.
      - name: Production build (no backend required)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci-placeholder"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      # This job's own ephemeral local Supabase stack — not shared with
      # the sql or playwright jobs, each of which boots an independent
      # instance on its own runner. Wrapped in a narrow retry
      # (scripts/start-supabase-ci.sh) — this step alone can hit a
      # transient public.ecr.aws/Docker Hub pull rate limit shared across
      # GitHub-hosted runner IPs. Nothing else in this job retries.
      - name: Start local Supabase
        run: bash scripts/start-supabase-ci.sh
      - name: Reset local database (apply migrations + seed)
        run: npm run db:reset
      - name: Generate .env.test from the local Supabase stack
        run: |
          npm run env:test:generate
          sed 's/"//g' .env.test >> "$GITHUB_ENV"

      - name: Vitest (unit + shared-current-game integration)
        run: npm test

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop

  sql:
    name: SQL & RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      # No `npm ci` here: db:start/db:reset/test:sql are all thin wrappers
      # around `npx supabase ...` and `psql` — neither touches this
      # project's own node_modules, so there is nothing for it to install.

      # This job's own ephemeral local Supabase stack (see the `vitest`
      # job's comment on why this isn't shared across jobs).
      - name: Start local Supabase
        run: bash scripts/start-supabase-ci.sh
      - name: Reset local database (apply migrations + seed)
        run: npm run db:reset

      # No .env.test generation needed: scripts/test-sql.sh's SUPABASE_DB_URL
      # fallback already points at this exact local stack's fixed port.
      - name: SQL / RLS
        run: npm run test:sql

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # This job's own ephemeral local Supabase stack (see the `vitest`
      # job's comment on why this isn't shared across jobs).
      - name: Start local Supabase
        run: bash scripts/start-supabase-ci.sh
      - name: Reset local database (apply migrations + seed)
        run: npm run db:reset
      - name: Generate .env.test from the local Supabase stack
        run: |
          npm run env:test:generate
          sed 's/"//g' .env.test >> "$GITHUB_ENV"

      - name: Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
