# Minimal Supabase CLI config. Full config is generated by `supabase init`;
# this stub exists so `supabase link` / `supabase db push` can target the
# Rankle project while migrations are the source of truth.
#
# Link once with:
#   supabase link --project-ref zhivsldkpavidxzrgtjl
#
# Canonical application timezone (America/Los_Angeles) is NOT a Supabase setting.
# It lives in the database as private.app_tz() (migration 1). GoTrue auth
# providers, redirect URLs, and rate limits are configured in the dashboard and
# documented in docs/DEPLOY.md.

project_id = "rankle"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
